[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "eerly-workspace-ai"
version = "0.1.0"
description = "AI Document and Report Workspace Consultant for the Eerly.AI Engineer Assessment"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "sqlalchemy",
    "alembic",
    "langchain-google-genai",
    "PyJWT",
    "streamlit",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]


[tool.setuptools.packages.find]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
